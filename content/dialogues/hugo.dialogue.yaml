npc: hugo
nodes:
  intranet-intro:
    - say: Ah, te voilà ! L'intranet est tombé depuis 8 h et les commerciaux de Rennes me harcèlent.
      mood: inquiet
    - say: C'est srv-web01, une Debian avec Apache. Je t'ouvre une session SSH.
    - say: Tu veux un indice avant de te lancer ?
      choices:
        - text: Oui, un indice
          then:
            - say: Commence toujours par l'état du service. Le message d'erreur dit souvent tout.
        - text: Non, je gère
          effects: [{ flag: hugo-confiance }]
          then:
            - say: J'aime cette confiance. Tape « aide » si tu bloques.
    - effects: [{ startStep: diagnostic }]

  intranet-outro:
    - say: Un /var plein à cause d'un journal de débogage de 18 Go… grand classique !
      mood: content
    - if: { flag: hugo-confiance }
      say: Et sans indice, en plus. Je vais finir par te laisser les clés de la salle serveurs.
    - say: Pense à logrotate. Ticket clos, merci !

  intranet-abandon:
    - say: Pas de souci, reviens quand tu veux. Le serveur ne va pas se réparer tout seul, par contre !
      mood: inquiet

  # --- Chapitre 4 : utilisation de GNU/Linux ---------------------------------------------

  decouverte-intro:
    - say: Bienvenue dans l'équipe ! Cette semaine, c'est Linux. Ici, tous les serveurs tournent sous Debian.
      mood: content
    - say: Avant de te donner un terminal, trois questions. Pas de piège, promis… enfin, presque.
    - effects: [{ startStep: libre }]

  decouverte-outro:
    - say: Parfait. Retiens surtout que Linux, c'est le noyau, et Debian, une distribution autour.
      mood: content
    - say: Prochaine étape, le clavier. Reviens me voir quand tu veux.

  connexion-intro:
    - say: Je t'ai créé un compte « stagiaire » sur deb-formation, la machine virtuelle de la salle de formation.
    - say: Premier réflexe sur une machine inconnue - savoir qui on est et où on est. Toujours.
    - effects: [{ startStep: identite }]

  connexion-outro:
    - say: Tu as vu pts/0 dans who ? C'est ta session SSH. La console de la machine, elle, s'appelle tty1.
      mood: content
    - say: Sur les serveurs, tu passeras ta vie en SSH. Pas d'écran, pas de souris.

  aide-intro:
    - say: Règle d'or du service - avant de me demander, on lit le manuel. RTFM, comme on dit poliment.
      mood: content
    - say: Il y a trois façons de trouver de l'aide. Je veux que tu les essaies toutes.
    - effects: [{ startStep: manuels }]

  aide-outro:
    - say: Avec man et apropos, tu n'as plus besoin de moi pour la moitié des questions.
      mood: content
    - say: Pour l'autre moitié, il y a le café.

  arborescence-intro:
    - say: J'ai caché des indices dans deb-formation. Le premier est dans ton dossier personnel, mais il ne se voit pas.
      mood: content
    - say: Suis la piste. Tu vas visiter les dossiers les plus importants du système.
    - effects: [{ startStep: chasse }]

  arborescence-outro:
    - say: TUX-1991, bravo ! Tu sais maintenant où vivent la configuration, les journaux et les fichiers temporaires.
      mood: content

  fichiers-intro:
    - say: Regarde ce dossier « bazar »… Rapports, photos du pot de départ, fichiers temporaires, tout en vrac.
      mood: inquiet
    - say: Range-moi ça proprement. Et fais un lien vers le dernier rapport, la direction le demande tout le temps.
    - effects: [{ startStep: rangement }]

  fichiers-outro:
    - say: Propre. Attention avec rm - sous Linux, il n'y a pas de corbeille. Ce qui est supprimé est perdu.
      mood: content

  regex-intro:
    - say: Quelqu'un tente de se connecter en SSH à srv-web01 depuis Internet. J'ai copié le journal d'authentification pour toi.
      mood: inquiet
    - say: Fais-le parler - combien d'échecs, et qui insiste.
    - effects: [{ startStep: enquete }]

  regex-outro:
    - say: 203.0.113.45 qui tente root en boucle… classique. On en reparlera avec fail2ban, plus tard dans l'année.
      mood: content
    - if: { flag: hugo-confiance }
      say: Et oui, l'échec de 8 h 44, c'est moi. Avant mon premier café, ça ne compte pas.
    - say: Une ligne dans un journal, c'est une preuve. grep est ton meilleur ami.

  recherche-intro:
    - say: Julie, de la compta, a « perdu » son budget 2027 sur le partage. Elle jure qu'elle ne l'a pas déplacé.
    - say: Ils jurent tous ça. Retrouve-le, je te montre deux méthodes très différentes.
    - effects: [{ startStep: fouille }]

  recherche-outro:
    - say: Dans « archives-julie/divers »… Elle était sûre de rien avoir touché, hein. Je lui envoie le chemin.
      mood: content

  vim-intro:
    - say: Sur un serveur, pas de bloc-notes. Il y a vim, et il y a les gens coincés dans vim depuis des années.
      mood: content
    - say: Le message d'accueil de deb-formation a une faute et une ligne en trop. Corrige-le.
    - effects: [{ startStep: modes }]

  vim-outro:
    - say: Tu sais sortir de vim. Tu fais déjà mieux qu'une bonne partie d'Internet.
      mood: content

  processus-intro:
    - say: deb-formation rame. Quelqu'un a lancé un exercice Python qui tourne en boucle depuis ce matin.
      mood: inquiet
    - say: Trouve-le, arrête-le, et profites-en pour apprendre à envoyer les sorties dans des fichiers.
    - effects: [{ startStep: emballement }]

  processus-outro:
    - say: Le processeur respire. ps, kill, tubes et redirections - c'est la plomberie de Linux.
      mood: content

  archives-intro:
    - say: Je réinstalle deb-formation vendredi. Mets tes projets en carton avant, et compresse ce journal de 120 Mo.
    - effects: [{ startStep: carton }]

  archives-outro:
    - say: Et tu as testé l'extraction. Une sauvegarde qu'on n'a jamais restaurée, ce n'est pas une sauvegarde.
      mood: content

  epreuve-linux-intro:
    - say: Dernier jour de la semaine, c'est l'épreuve. Mme Garnier attend le rapport mensuel des incidents.
    - say: Le fichier est égaré quelque part sur le partage, et il manque le nombre d'incidents critiques d'octobre.
    - say: C'est noté sur 20 - chaque indice et chaque erreur coûtent un point. Tu as toute la semaine dans les doigts.
      mood: content
    - effects: [{ startStep: retrouver }]

  epreuve-linux-outro:
    - say: Rapport retrouvé, complété, archivé. C'est exactement le travail qu'on attend au support.
      mood: content
    - say: Badge Linux pour toi. La semaine prochaine, on passe à l'administration, dans la salle serveurs.

  epreuve-linux-abandon:
    - say: Pas grave, reprends ton souffle. L'épreuve t'attend, et le rapport aussi.

  # --- Chapitre 5 : administration de GNU/Linux -------------------------------------------

  installer-intro:
    - say: Bienvenue en salle serveurs ! Ici, ça souffle, ça clignote, et c'est là que tout se passe.
      mood: content
    - say: On reçoit un serveur neuf la semaine prochaine. Avant que tu l'installes, voyons si tu connais la marche à suivre.
    - effects: [{ startStep: etapes }]

  installer-outro:
    - say: Tu sais installer une Debian propre. Pas de bureau, /var à part, SSH. Comme on aime.
      mood: content

  paquets-intro:
    - say: Quelqu'un a lancé une mise à jour sur srv-web01 hier soir… et a fermé son portable au milieu.
      mood: inquiet
    - say: Résultat, dpkg est bloqué, et des correctifs de sécurité attendent. Remets ça d'aplomb.
    - effects: [{ startStep: reparer }]

  paquets-outro:
    - say: Paquets à jour, dpkg débloqué. Tu as lu le message d'erreur au lieu de paniquer - c'est déjà la moitié du métier.
      mood: content

  boot-intro:
    - say: Coupure de courant cette nuit - il pleuvait tellement que l'onduleur a rendu l'âme.
      mood: inquiet
    - say: srv-web01 a redémarré, mais l'intranet ne répond pas et le disque des archives n'est pas monté. Karim appelle déjà.
    - say: Répare, et surtout, fais en sorte que ça tienne au prochain redémarrage.
    - effects: [{ startStep: sequence }]

  boot-outro:
    - say: /dev/sdc1… Gégé avait écrit le nom du disque au lieu de son UUID. Le jour où on a retiré un disque, tout a glissé.
      mood: content
    - say: Et Apache n'avait jamais été activé. Il tournait depuis deux ans parce que personne n'avait redémarré.

  comptes-intro:
    - say: Deux arrivées ce lundi - Julie à la compta, Paul chez les commerciaux. Il leur faut un compte sur srv-fichiers.
    - say: Et Gégé est parti il y a trois mois. Son compte est toujours ouvert. Toujours.
      mood: inquiet
    - effects: [{ startStep: comptes }]

  comptes-outro:
    - say: Comptes créés, mots de passe provisoires, et le compte de Gégé verrouillé.
      mood: content
    - say: On le supprimera plus tard. D'abord, on regarde ce qu'il a laissé derrière lui.

  droits-intro:
    - say: Julie a enregistré les salaires sur le partage compta. Le dossier est en 777. N'importe qui peut lire les salaires de tout le monde.
      mood: inquiet
    - say: Et Marc ne peut pas modifier les fichiers de Julie. Les droits, c'est le chantier du jour.
    - effects: [{ startStep: compta }]

  droits-outro:
    - say: 2770 pour la compta, 1777 pour le dépôt, 640 pour les salaires. Tu parles couramment l'octal.
      mood: content

  disque-intro:
    - say: Le partage déborde. J'ai ajouté un disque de 20 Go à srv-fichiers - sdb, tout neuf, tout vide.
    - say: On passe par LVM. Le jour où il sera plein, on l'agrandira sans rien arrêter.
    - effects: [{ startStep: lvm }]

  disque-outro:
    - say: Partitionné, formaté, monté, et déclaré dans fstab. Il survivra au redémarrage, lui.
      mood: content

  ip-intro:
    - say: srv-fichiers a été installé en DHCP. Un serveur qui change d'adresse, c'est des partages qui disparaissent.
      mood: inquiet
    - say: Donne-lui 192.168.10.30, de façon permanente.
    - effects: [{ startStep: constat }]

  ip-outro:
    - say: Adresse fixe, ping qui répond. Pense à mettre à jour la fiche du serveur dans GLPI, plus tard.
      mood: content

  processus-admin-intro:
    - say: srv-web01 rame à mort. Karim n'arrive plus à ouvrir l'intranet.
      mood: inquiet
    - say: Je vois un export de Paul qui mange toute la mémoire, et la sauvegarde de nuit qui n'a pas fini. Attention, la sauvegarde, on la garde.
    - effects: [{ startStep: diagnostic }]

  processus-admin-outro:
    - say: Mémoire libérée, sauvegarde ralentie mais vivante. C'est la bonne réponse - on ne tue pas une sauvegarde.
      mood: content

  cron-intro:
    - say: Le pare-feu signale que srv-web01 contacte une adresse inconnue toutes les nuits, vers 3 h.
      mood: inquiet
    - say: Quelque chose est planifié. Trouve quoi, et qui l'a mis là.
    - effects: [{ startStep: enquete }]

  cron-outro:
    - say: Une tâche de Gégé qui téléchargeait un script et l'exécutait, toutes les nuits, depuis 2024.
      mood: inquiet
    - say: Je préviens M. Leroy. Ce n'est peut-être rien… mais c'est la même adresse que celle qui tentait root en SSH.
    - effects: [{ flag: fil-rouge-cron-gege }]

  epreuve-admin-intro:
    - say: Dernière ligne droite de l'administration Linux. Mme Garnier veut un nouvel intranet sur srv-intranet.
    - say: Debian toute neuve. Tu installes, tu configures, tu sécurises les droits, tu planifies la sauvegarde. Tu es aux commandes.
      mood: content
    - say: Noté sur 20, comme d'habitude - chaque indice et chaque erreur coûtent un point.
    - effects: [{ startStep: installer }]

  epreuve-admin-outro:
    - say: http://intranet.lab.local répond. Mme Garnier est ravie, et moi aussi.
      mood: content
    - say: Badge Linux Admin pour toi. Tu peux garder le badge de la salle serveurs, tu l'as mérité.

  epreuve-admin-abandon:
    - say: Pas de souci. srv-intranet t'attend, il n'est pas pressé - Mme Garnier un peu plus.

  default:
    - say: Si tu as un doute, relis les journaux. Toujours les journaux.
